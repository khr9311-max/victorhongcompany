# 빅터홍컴퍼니 AI 투자회사 — 내부 모의운용 설정(internal_paper·offline_demo 전용, LIVE에는 적용하지 않음)
# 가상 원금 38,000,000원: 코인 100만·국내주식 2,500만·미국주식 1,200만 + Gemini AI 직원 6명(C). 안내: docs/multi-market-paper.md
# 주식 배정액은 전략별 한 종목 몫으로 SK하이닉스(약 178만 원)·MSFT(약 518달러)를 1주 이상 살 수 있게 정했다(2026-10-01 시세).
# LIVE·증권사 모의(broker_sandbox)는 config/config.toml을 씁니다. 여기 값을 바꿔도 실제 계좌 한도는 바뀌지 않습니다.
# 파일이 바뀌면 다음 시작 때 '바뀐 항목만' 새 설정 버전으로 반영되고, 대시보드·CLI로 바꾼 다른 값은 유지됩니다.
# 아래 값은 '엔지니어링 프리셋'이며 검증된 최적 투자조건이 아닙니다. AI는 설정을 바꿀 수 없습니다.

operating_setting = "C"          # 운용 장부에 쓰는 단일 설정: A(규칙만) / B(+AI 연구팀) / C(+AI 연구팀·검증팀)

[risk]
principal_cap_krw = "38000000"    # 가상 원금(바꾸면 다음 시작 때 모의 장부에 차액을 원금 조정으로 기록)
gross_exposure_cap_krw = "38000000" # 보유 노출 + 위험 증가 주문 예약금(수수료 여유 포함) 합계 한도
max_order_notional_krw = "3000000" # SK하이닉스 1주(약 178만 원)가 한 주문에 들어가게
max_open_positions = 8
daily_loss_stop_krw = "3800000"    # 원금의 10%
max_drawdown_stop_pct = "30"
leverage = 1                      # 고정
borrow = false                    # 고정
short = false                     # 고정
fee_buffer_pct = "0.3"
max_quote_age_sec = 45
max_fx_age_hours = 96             # ECB 기준환율은 주말에 3일 이상 갱신되지 않음
fx_haircut_pct = "3"
max_clock_skew_sec = 5.0
min_24h_turnover_krw = "1000000000"
max_spread_pct = "0.5"
max_signal_age_sec = 900          # 봉 마감 후 이 시간이 지나면 그 봉의 신호는 실행하지 않음

[markets.crypto]
enabled = true
broker = "upbit"                  # 내부 모의에서는 주문이 가상 체결되며, 업비트 공개 시세만 사용
account_id = "upbit-main"
instruments = ["KRW-BTC", "KRW-ETH", "KRW-XRP"]
candle = "60m"
allocation_krw = "1000000"

[markets.kr_stock]
enabled = true
broker = "paper"                  # 내부 가상 체결 전용(증권사 주문 없음)
data_provider = "kiwoom"          # 키움 REST 조회(국내 일봉·호가). "default"면 KIS 시세
account_id = "paper-main"
instruments = ["005930", "000660"]  # 삼성전자, SK하이닉스
candle = "1d"
allocation_krw = "25000000"
history_bars = 600                # 판단에 쓰는 완성봉 수(처음 한 번 과거 일봉을 받아 채움). 연구소 52주·12개월 전략용

[markets.us_stock]
enabled = true
broker = "paper"
data_provider = "kiwoom"          # 키움 미국주식 조회(usa20101·usa06012), 국내와 같은 키 사용
account_id = "paper-main"
instruments = ["NASD:NVDA", "NASD:MSFT"]
candle = "1d"
allocation_krw = "12000000"       # 미국 사이클에서 신선한 환율로 이 금액 이내의 원화를 달러로 모의 환전
history_bars = 600

[strategies]
rebalance_threshold_krw = "10000"
[strategies.sleeves]
trend_sma = "0.4"
mean_reversion = "0.4"
ai_research = "0.2"               # A 설정에서는 현금으로 유지
[strategies.trend_sma]
enabled = true
params = { fast = 20, slow = 60 }
[strategies.mean_reversion]
enabled = true
params = { bb_period = 20, bb_k = "2.0", rsi_entry = "30", rsi_exit = "55", stop_loss_pct = "8", max_hold_bars = 48 }
# 전략 연구소 전략(모의 운용으로 전진 검증). 과거 데이터 검증에서는 무작위 진입보다 낫다는 근거가 나오지 않았다(docs/strategy-lab.md).
# 키 = `aifund lab catalog`의 변형 id, 자금은 아래 시장별 슬리브의 "lab:변형 id". 끄려면 enabled = false
[strategies.lab.rs_top]                     # 순환: 12-1개월 상대강도 상위 1/4, 매월 교체
markets = ["kr_stock", "us_stock"]
[strategies.lab."high_52w.atr_trail"]       # 추세: 52주 신고가 돌파 → 최고가 − 3 ATR 추적 손절
markets = ["kr_stock", "us_stock"]
[strategies.lab."trendy_kangaroo.split"]    # 책 패턴: 트렌디 캥거루 → 분할 청산
markets = ["kr_stock", "us_stock"]
# 시장별 슬리브: 국내·미국주식은 연구소 전략 3개에 50%를 배정하고 봇 A·B는 15%씩(코인은 위 기본 슬리브 그대로).
# 종목별 타이밍 전략(봇 A·B, 52주 신고가, 트렌디 캥거루)은 몫을 종목 수로 나누고, 상대강도는 고른 종목(자리)에 몰아 준다.
[strategies.market_sleeves.kr_stock]
trend_sma = "0.15"
mean_reversion = "0.15"
ai_research = "0.2"
"lab:rs_top" = "0.2"
"lab:high_52w.atr_trail" = "0.15"
"lab:trendy_kangaroo.split" = "0.15"
[strategies.market_sleeves.us_stock]
trend_sma = "0.15"
mean_reversion = "0.15"
ai_research = "0.2"
"lab:rs_top" = "0.2"
"lab:high_52w.atr_trail" = "0.15"
"lab:trendy_kangaroo.split" = "0.15"

[ai]
enabled = true
provider = "gemini"               # anthropic / gemini / ollama / disabled — 모델도 같은 공급자 것으로
model = "gemini-3.8-flash"        # 최신 정식 Flash(2026-09-02 출시). 비용보다 분석 품질 우선
# AI 연구팀·검증 AI에 대표 지시로 전달(대시보드 설정에서도 수정 가능). 매매 권한은 없습니다.
research_focus = "AI·반도체·IT를 우선 검토한다. 제공된 최신 뉴스에서 실적, HBM, AI 인프라, 클라우드와 시장 이슈를 확인한다. 뉴스가 많다는 이유만으로 매수하지 말고 가격 신호·반론·비용을 함께 평가한다. 허용 목록 밖의 이슈 종목은 시장 요약에 관찰 후보로만 적고 매매 제안에는 넣지 않는다."
effort = "high"                   # Claude effort / Gemini 추론 강도(thinkingLevel: low·medium·high)
use_server_fallbacks = false      # Claude 전용 서버측 폴백
monthly_budget_krw = "300000"     # 비용 제약이 아니라 호출 폭주(버그) 방지용 안전 상한. 예상 사용은 월 약 7~9만 원(2027년부터 약 2배)
max_output_tokens = 32000         # 추론 토큰 포함 상한(잘린 응답은 제안으로 쓰지 않음). 16000은 추론 high에서 잘림 발생
max_input_chars = 60000
max_news_items = 60               # 연구에 넣는 최근 48시간 뉴스·공시 수
timeout_sec = 300
daily_research_time_kst = "08:50" # 코인 정기 연구 기준 시각
crypto_research_interval_hours = 6  # 코인: 08:50·14:50·20:50·02:50
stock_research_lead_min = 30      # 주식: 거래일 개장 30분 전(국내 08:30, 미국 한국시간 22:00·서머타임 해제 시 23:00)
weekly_review_weekday = 0         # 월요일
weekly_review_time_kst = "09:10"
event_move_pct = "5"
max_event_calls_per_day = 3       # 직전 봉 5% 이상 급변 시 시장별 하루 최대 추가 연구 수
independent_review_pass = true
# AI 직원(연구 화면 'AI 직원'): 연구 1회 = 뉴스·퀀트 애널리스트 → 수석 연구원 → 검증 AI(독립 평가·반론) → 리스크 매니저
news_analyst_enabled = true       # 뉴스·공시를 사건별로 정리해 수석 연구원에게 전달
quant_analyst_enabled = true      # 가격 사실·봇 신호로 국면·전략 적합도 판단
risk_manager_enabled = true       # C 설정: 검증 통과한 AI 매수·유지 제안을 회사 전체 보유와 함께 축소·거절
analyst_effort = "medium"         # 애널리스트 추론 강도(분류·정리 업무). high는 추론만으로 출력 한도를 넘겨 잘릴 수 있음(2026-09-30 실측)
veto_rule_buys = true
when_unavailable = "continue_rules"   # 또는 hold_new_risk
fallback_usdkrw = "1500"

# 요율 표(USD/백만 토큰, Gemini 출력은 추론 토큰 포함). 표에 없는 모델은 유료 자동 호출을 하지 않습니다.
# 출처: Gemini https://ai.google.dev/gemini-api/docs/pricing (2026-09-24 갱신본), Claude https://platform.claude.com/docs/en/about-claude/pricing
[ai.pricing."gemini-3.8-flash"]
input_usd_per_mtok = "0.75"       # 도입가(2026-12-31까지)
output_usd_per_mtok = "3.75"
source = "https://ai.google.dev/gemini-api/docs/pricing"
checked_at = "2026-09-30"
changes_on = "2027-01-01"         # 이날부터 표준가로 자동 계산
new_input_usd_per_mtok = "1.50"
new_output_usd_per_mtok = "7.50"
[ai.pricing."gemini-3.5-flash-lite"]
input_usd_per_mtok = "0.30"
output_usd_per_mtok = "2.50"
source = "https://ai.google.dev/gemini-api/docs/pricing"
checked_at = "2026-09-29"
[ai.pricing."claude-opus-5"]
input_usd_per_mtok = "5"
output_usd_per_mtok = "25"
source = "platform.claude.com/docs/en/about-claude/pricing"
checked_at = "2026-09-29"
[ai.pricing."claude-opus-4-8"]
input_usd_per_mtok = "5"
output_usd_per_mtok = "25"
source = "platform.claude.com/docs/en/about-claude/pricing"
checked_at = "2026-09-29"
[ai.pricing."claude-sonnet-5"]
input_usd_per_mtok = "2"
output_usd_per_mtok = "10"
source = "platform.claude.com/docs/en/about-claude/pricing"
checked_at = "2026-09-29"
[ai.pricing."claude-haiku-4-5"]
input_usd_per_mtok = "1"
output_usd_per_mtok = "5"
source = "platform.claude.com/docs/en/about-claude/pricing"
checked_at = "2026-09-29"

[execution]
order_ttl_sec = 120
limit_offset_bps = "10"           # 매도1호가 + 0.10% 이내 지정가(시장가 대신)
liquidation_offset_bps = "30"
liquidation_max_reprice = 3
unknown_resolution_window_sec = 900
[execution.paper]
fee_rate = "0.0005"
stock_fee_rate = "0.00015"
kr_sell_tax_rate = "0.0020"        # 연도별 세율 변동 → 사용자 확인 필요
us_fee_rate = "0.0025"             # 모의 환전 수수료는 별도로 반영하지 않음
slippage_bps = "5"
max_fill_fraction = "0.5"

[schedule]
quote_poll_sec = 15
order_poll_sec = 5
reconcile_interval_sec = 300
equity_snapshot_sec = 60
heartbeat_sec = 10
news_poll_min = 60                # 네이버 검색어 1개당 이 주기마다 1회 호출
fx_poll_min = 60

[fx]
provider = "frankfurter"          # frankfurter / manual / none

[news]
naver_enabled = true              # NAVER_CLIENT_ID/SECRET 필요. 기본 CoinDesk RSS는 코드 기본값으로 계속 수집
[news.naver_queries]              # 시장별 최대 10개. 종목을 바꾸면 검색어도 함께 확인
crypto = ["비트코인", "이더리움", "리플"]
kr_stock = ["삼성전자 반도체", "SK하이닉스 HBM", "국내 증시 AI 반도체 IT", "국내 증시 특징주"]
us_stock = ["엔비디아 AI", "마이크로소프트 AI 클라우드", "미국 증시 반도체 IT", "미국 증시 특징주"]

[notify]
telegram = true                   # 대시보드에서 켠 값(설정 v5)을 복원. 키는 .env의 AIFUND_TELEGRAM_*
webhook = false
min_severity = "warning"

[web]
host = "127.0.0.1"
port = 8765
require_login_for_read = false
