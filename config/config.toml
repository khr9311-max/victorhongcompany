# 빅터홍컴퍼니 AI 투자회사 — LIVE(실거래)·broker_sandbox(증권사 모의) 설정
# 내부 모의운용(internal_paper)·데모(offline_demo)는 config/paper.toml을 씁니다.
# 파일이 바뀌면 다음 시작 때 '바뀐 항목만' 새 설정 버전으로 반영되고, 대시보드·CLI로 바꾼 다른 값은 유지됩니다.
# 한도·종목·계좌·시세 공급자·운용 설정이 바뀌면 그 시장의 LIVE는 '재확인 필요'로 멈춥니다. AI는 설정을 바꿀 수 없습니다.
# 아래 값은 '엔지니어링 프리셋'이며 검증된 최적 투자조건이 아닙니다.

operating_setting = "A"          # 실제 주문에 쓰는 단일 설정: A(규칙만) / B(+AI 연구팀) / C(+AI 연구팀·검증팀)

[risk]
principal_cap_krw = "300000"
gross_exposure_cap_krw = "300000" # 보유 노출 + 위험 증가 주문 예약금(수수료 여유 포함) 합계 한도
max_order_notional_krw = "100000"
max_open_positions = 3
daily_loss_stop_krw = "30000"
max_drawdown_stop_pct = "30"
leverage = 1                      # 고정
borrow = false                    # 고정
short = false                     # 고정
fee_buffer_pct = "0.3"
max_quote_age_sec = 45
max_fx_age_hours = 96             # ECB 기준환율은 주말에 3일 이상 갱신되지 않음
fx_haircut_pct = "3"
max_clock_skew_sec = 5.0
min_24h_turnover_krw = "1000000000"
max_spread_pct = "0.5"
max_signal_age_sec = 900          # 봉 마감 후 이 시간이 지나면 그 봉의 신호는 실행하지 않음

[markets.crypto]
enabled = true
broker = "upbit"
account_id = "upbit-main"
instruments = ["KRW-BTC", "KRW-ETH", "KRW-XRP"]
candle = "60m"
allocation_krw = "300000"

[markets.kr_stock]
enabled = false
broker = "kis"
data_provider = "kiwoom"          # 시세만 키움 REST 조회(주문은 KIS). LIVE에서는 KIWOOM_DATA_ENV=real 키만 사용(mock 시세 차단)
account_id = "kis-main"
instruments = ["005930"]
candle = "1d"
allocation_krw = "0"

[markets.us_stock]
enabled = false
broker = "kis"
account_id = "kis-main"
instruments = ["NASD:AAPL"]
candle = "1d"
allocation_krw = "0"

[strategies]
rebalance_threshold_krw = "10000"
[strategies.sleeves]
trend_sma = "0.4"
mean_reversion = "0.4"
ai_research = "0.2"               # A 설정에서는 현금으로 유지
[strategies.trend_sma]
enabled = true
params = { fast = 20, slow = 60 }
[strategies.mean_reversion]
enabled = true
params = { bb_period = 20, bb_k = "2.0", rsi_entry = "30", rsi_exit = "55", stop_loss_pct = "8", max_hold_bars = 48 }

[ai]
enabled = true
provider = "gemini"               # anthropic / gemini / ollama / disabled — 모델도 같은 공급자 것으로
model = "gemini-3.8-flash"        # 아래 요율 표에 있어야 유료 자동 호출
effort = "high"                   # Claude effort / Gemini 추론 강도(thinkingLevel)
use_server_fallbacks = false      # Claude 전용: 모델 거절 시 서버측 폴백(비용은 실제 사용 모델 요율로 정산)
monthly_budget_krw = "300000"     # 호출 폭주(버그) 방지용 안전 상한(AI 직원 6명 기준 예상 월 7~9만 원)
max_output_tokens = 32000         # 추론 토큰 포함 상한(16000은 추론 high에서 잘림 발생)
max_input_chars = 60000
max_news_items = 60
timeout_sec = 300
daily_research_time_kst = "08:50" # 코인 정기 연구 기준 시각
crypto_research_interval_hours = 6
stock_research_lead_min = 30      # 주식: 거래일 개장 30분 전
weekly_review_weekday = 0         # 월요일
weekly_review_time_kst = "09:10"
event_move_pct = "5"
max_event_calls_per_day = 3
independent_review_pass = true
# AI 직원(연구 화면 'AI 직원'): 연구 1회 = 뉴스·퀀트 애널리스트 → 수석 연구원 → 검증 AI(독립 평가·반론) → 리스크 매니저
news_analyst_enabled = true       # 뉴스·공시를 사건별로 정리해 수석 연구원에게 전달
quant_analyst_enabled = true      # 가격 사실·봇 신호로 국면·전략 적합도 판단
risk_manager_enabled = true       # C 설정: 검증 통과한 AI 매수·유지 제안을 회사 전체 보유와 함께 축소·거절
analyst_effort = "medium"         # 애널리스트 추론 강도(분류·정리 업무). high는 추론만으로 출력 한도를 넘겨 잘릴 수 있음(2026-09-30 실측)
veto_rule_buys = true
when_unavailable = "continue_rules"   # 또는 hold_new_risk
fallback_usdkrw = "1500"

# 요율 표(USD/백만 토큰, Gemini 출력은 추론 토큰 포함). 표에 없는 모델은 유료 자동 호출을 하지 않습니다.
# 출처: Gemini https://ai.google.dev/gemini-api/docs/pricing (2026-09-24 갱신본), Claude https://platform.claude.com/docs/en/about-claude/pricing
[ai.pricing."gemini-3.8-flash"]
input_usd_per_mtok = "0.75"       # 도입가(2026-12-31까지)
output_usd_per_mtok = "3.75"
source = "https://ai.google.dev/gemini-api/docs/pricing"
checked_at = "2026-09-30"
changes_on = "2027-01-01"         # 이날부터 표준가로 자동 계산
new_input_usd_per_mtok = "1.50"
new_output_usd_per_mtok = "7.50"
[ai.pricing."gemini-3.5-flash-lite"]
input_usd_per_mtok = "0.30"
output_usd_per_mtok = "2.50"
source = "https://ai.google.dev/gemini-api/docs/pricing"
checked_at = "2026-09-29"
[ai.pricing."claude-opus-5"]
input_usd_per_mtok = "5"
output_usd_per_mtok = "25"
source = "platform.claude.com/docs/en/about-claude/pricing"
checked_at = "2026-09-29"
[ai.pricing."claude-opus-4-8"]
input_usd_per_mtok = "5"
output_usd_per_mtok = "25"
source = "platform.claude.com/docs/en/about-claude/pricing"
checked_at = "2026-09-29"
[ai.pricing."claude-sonnet-5"]
input_usd_per_mtok = "2"
output_usd_per_mtok = "10"
source = "platform.claude.com/docs/en/about-claude/pricing"
checked_at = "2026-09-29"
[ai.pricing."claude-haiku-4-5"]
input_usd_per_mtok = "1"
output_usd_per_mtok = "5"
source = "platform.claude.com/docs/en/about-claude/pricing"
checked_at = "2026-09-29"

[execution]
order_ttl_sec = 120
limit_offset_bps = "10"           # 매도1호가 + 0.10% 이내 지정가(시장가 대신)
liquidation_offset_bps = "30"
liquidation_max_reprice = 3
unknown_resolution_window_sec = 900
[execution.paper]
fee_rate = "0.0005"
stock_fee_rate = "0.00015"
kr_sell_tax_rate = "0.0020"        # 연도별 세율 변동 → 사용자 확인 필요
us_fee_rate = "0.0025"
slippage_bps = "5"
max_fill_fraction = "0.5"

[schedule]
quote_poll_sec = 15
order_poll_sec = 5
reconcile_interval_sec = 300
equity_snapshot_sec = 60
heartbeat_sec = 10
news_poll_min = 60
fx_poll_min = 60

[fx]
provider = "frankfurter"          # frankfurter / manual / none

[news]
naver_enabled = true              # NAVER_CLIENT_ID/SECRET 필요. 기본 CoinDesk RSS는 코드 기본값으로 계속 수집
[news.naver_queries]              # 시장별 최대 10개. 주식 시장을 켜면 kr_stock / us_stock 검색어도 추가
crypto = ["비트코인", "이더리움", "리플"]

[notify]
telegram = false
webhook = false
min_severity = "warning"

[web]
host = "127.0.0.1"
port = 8765
require_login_for_read = false
