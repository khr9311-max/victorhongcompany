# 빅터홍컴퍼니 AI 투자회사 — 설정 예제
# `aifund setup`이 config/config.toml로 복사합니다. 파일이 바뀌면 다음 시작 시 새 설정 버전으로 기록됩니다.
# 대시보드·CLI(`aifund settings set`)로 바꾼 값도 버전으로 남습니다. AI는 설정을 바꿀 수 없습니다.
# 아래 값은 '엔지니어링 프리셋'이며 검증된 최적 투자조건이 아닙니다.

operating_setting = "A"          # 실제 주문에 쓰는 단일 설정: A(규칙만) / B(+연구 AI) / C(+연구·검증 AI)

[risk]
principal_cap_krw = "300000"
gross_exposure_cap_krw = "300000" # 보유 노출 + 위험 증가 주문 예약금(수수료 여유 포함) 합계 한도
max_order_notional_krw = "100000"
max_open_positions = 3
daily_loss_stop_krw = "30000"
max_drawdown_stop_pct = "30"
leverage = 1                      # 고정
borrow = false                    # 고정
short = false                     # 고정
fee_buffer_pct = "0.3"
max_quote_age_sec = 45
max_fx_age_hours = 96             # ECB 기준환율은 주말에 3일 이상 갱신되지 않음
fx_haircut_pct = "3"
max_clock_skew_sec = 5.0
min_24h_turnover_krw = "1000000000"
max_spread_pct = "0.5"
max_signal_age_sec = 900          # 봉 마감 후 이 시간이 지나면 그 봉의 신호는 실행하지 않음

[markets.crypto]
enabled = true
broker = "upbit"
account_id = "upbit-main"
instruments = ["KRW-BTC", "KRW-ETH", "KRW-XRP"]
candle = "60m"
allocation_krw = "300000"

[markets.kr_stock]
enabled = false
broker = "kis"
account_id = "kis-main"
instruments = ["005930"]
candle = "1d"
allocation_krw = "0"

[markets.us_stock]
enabled = false
broker = "kis"
account_id = "kis-main"
instruments = ["NASD:AAPL"]
candle = "1d"
allocation_krw = "0"

[strategies]
rebalance_threshold_krw = "10000"
[strategies.sleeves]
trend_sma = "0.4"
mean_reversion = "0.4"
ai_research = "0.2"               # A 설정에서는 현금으로 유지
[strategies.trend_sma]
enabled = true
params = { fast = 20, slow = 60 }
[strategies.mean_reversion]
enabled = true
params = { bb_period = 20, bb_k = "2.0", rsi_entry = "30", rsi_exit = "55", stop_loss_pct = "8", max_hold_bars = 48 }

[ai]
enabled = true
provider = "anthropic"            # anthropic / ollama / disabled
model = "claude-opus-5"           # 비용을 줄이려면 claude-sonnet-5 또는 claude-haiku-4-5 (요율 표에 있어야 호출됨)
effort = "medium"
use_server_fallbacks = true       # 모델 거절 시 서버측 폴백(비용은 실제 사용 모델 요율로 정산)
monthly_budget_krw = "5000"
max_output_tokens = 4000
daily_research_time_kst = "08:50"
weekly_review_weekday = 0         # 월요일
weekly_review_time_kst = "09:10"
event_move_pct = "5"
max_event_calls_per_day = 1
independent_review_pass = true
veto_rule_buys = true
when_unavailable = "continue_rules"   # 또는 hold_new_risk
fallback_usdkrw = "1500"

# 요율 표(USD/백만 토큰). 출처: https://platform.claude.com/docs/en/about-claude/pricing (2026-09-29 확인)
# 표에 없는 모델은 유료 자동 호출을 하지 않습니다.
[ai.pricing."claude-opus-5"]
input_usd_per_mtok = "5"
output_usd_per_mtok = "25"
source = "platform.claude.com/docs/en/about-claude/pricing"
checked_at = "2026-09-29"
[ai.pricing."claude-opus-4-8"]
input_usd_per_mtok = "5"
output_usd_per_mtok = "25"
source = "platform.claude.com/docs/en/about-claude/pricing"
checked_at = "2026-09-29"
[ai.pricing."claude-sonnet-5"]
input_usd_per_mtok = "2"
output_usd_per_mtok = "10"
source = "platform.claude.com/docs/en/about-claude/pricing"
checked_at = "2026-09-29"
[ai.pricing."claude-haiku-4-5"]
input_usd_per_mtok = "1"
output_usd_per_mtok = "5"
source = "platform.claude.com/docs/en/about-claude/pricing"
checked_at = "2026-09-29"

[execution]
order_ttl_sec = 120
limit_offset_bps = "10"           # 매도1호가 + 0.10% 이내 지정가(시장가 대신)
liquidation_offset_bps = "30"
liquidation_max_reprice = 3
unknown_resolution_window_sec = 900
[execution.paper]
fee_rate = "0.0005"
stock_fee_rate = "0.00015"
kr_sell_tax_rate = "0.0020"        # 연도별 세율 변동 → 사용자 확인 필요
us_fee_rate = "0.0025"
slippage_bps = "5"
max_fill_fraction = "0.5"

[schedule]
quote_poll_sec = 15
order_poll_sec = 5
reconcile_interval_sec = 300
equity_snapshot_sec = 60
heartbeat_sec = 10
news_poll_min = 60
fx_poll_min = 60

[fx]
provider = "frankfurter"          # frankfurter / manual / none

[notify]
telegram = false
webhook = false
min_severity = "warning"

[web]
host = "127.0.0.1"
port = 8765
require_login_for_read = false
