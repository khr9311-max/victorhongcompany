[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "victorhong-aifund"
version = "0.1.0"
description = "빅터홍컴퍼니 AI 투자회사 — 소액 실험용 멀티 전략·AI 검토 자동매매 서비스"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "anthropic>=1.9",
    "exchange-calendars>=4.5",
    "defusedxml>=0.7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aifund = "aifund.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aifund = ["web/templates/*.html", "web/static/*", "db/migrations/*.sql", "ai/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
