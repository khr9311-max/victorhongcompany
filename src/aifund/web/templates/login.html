{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="card" style="max-width:520px">
  <h2>관리자 로그인</h2>
  {% if not has_token %}
  <p class="bad">관리자 토큰이 설정되지 않았습니다. 터미널에서 <code>aifund setup</code>을 실행하면 <code>.env</code>에 <code>AIFUND_ADMIN_TOKEN</code>이 생성됩니다.</p>
  {% endif %}
  <form method="post" action="/login" class="inline">
    <input type="password" name="token" placeholder="AIFUND_ADMIN_TOKEN" required autocomplete="current-password" style="min-width:320px">
    <button>로그인</button>
  </form>
  <p class="small muted">토큰은 프로젝트의 .env 파일에 있습니다. 화면·로그에는 표시되지 않습니다.</p>
</div>
{% endblock %}
